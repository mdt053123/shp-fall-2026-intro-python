{% extends "base.html" %}
{% block title %}{{ project.name }}{% endblock %}
{% block content %}
    <h1>{{ project.name }}</h1>
    <p>{{ project.description }}</p>
    {% if project.day >= 7 %}
        <p class="tag">Uses libraries (Day 7+)</p>
    {% else %}
        <p class="tag">Pure Python</p>
    {% endif %}
    <p><a href="/">← Back to all projects</a></p>
{% endblock %}
