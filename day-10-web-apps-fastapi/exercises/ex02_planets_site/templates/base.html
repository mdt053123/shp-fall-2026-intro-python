<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Solar System{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">🪐 Planets</a>
        <a href="/?sort=diameter_km">Biggest first</a>

            <input type="text" name="q" placeholder="Search...">

    </nav>
    <main>
        {% block content %}{% endblock %}

</body>
</html>
