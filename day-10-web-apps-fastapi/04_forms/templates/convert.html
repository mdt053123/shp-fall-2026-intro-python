{% extends "base.html" %}
{% block title %}Temperature Converter{% endblock %}
{% block content %}
    <h1>🌡️ Temperature Converter</h1>

    <!-- method="post" sends the data to our @app.post("/convert") function.
         Each input's NAME must match a parameter name in that function. -->
    <form action="/convert" method="post">
        <label>Temperature: <input type="number" step="any" name="temperature" required></label><br>
        <label>
            <select name="direction">
                <option value="f_to_c">°F → °C</option>
                <option value="c_to_f">°C → °F</option>
            </select>
        </label><br>
        <button type="submit">Convert</button>
    </form>

    {% if result %}
        <p class="result">{{ result }}</p>
    {% endif %}
{% endblock %}
